<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color-opacity=1.0, user-scalable=no, viewport-fit=cover">
    <title>麵包師傅在這ㄅㄥ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 讓影片完美適應手機螢幕 */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持比例。若想強行全螢幕不留上下黑邊，可改為 cover */
            outline: none;
        }
    </style>
</head>
<body>
    <!-- 
      playsinline / webkit-playsinline: 防止 iOS 自動彈出原生全螢幕播放器，讓它乖乖待在網頁裡
      autoplay: 自動播放
      loop: 無限循環
      muted: 靜音（iOS 規定必須加這個屬性，網頁一打開才會自動播放）
    -->
    <video src="IMG_8524.mov" playsinline webkit-playsinline autoplay loop muted></video>
</body>
</html>
